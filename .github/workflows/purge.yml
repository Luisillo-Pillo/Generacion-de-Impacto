name: Limpieza de datos

# Vacía la papelera de mensajes (más de 30 días) y aplica la retención de mensajes resueltos (RETENTION_MONTHS).
# Render gratuito no tiene tareas programadas, así que corre aquí. Si el secreto MONGODB_URI no existe, no hace nada.
# Para ver qué borraría sin borrar: Actions → Limpieza de datos → Run workflow → dry_run.

on:
  schedule:
    - cron: '17 9 * * *' # todos los días
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo contar lo que se borraría, sin borrar nada'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  limpiar:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      # Variable del repositorio (Settings → Secrets and variables → Actions → Variables). Sin definir: no se borra por antigüedad.
      RETENTION_MONTHS: ${{ vars.RETENTION_MONTHS }}
    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::notice::Falta el secreto MONGODB_URI: no se hizo nada."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.listo == 'si'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.listo == 'si'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace backend --include-workspace-root=false
        if: steps.config.outputs.listo == 'si'
      # En ejecución programada no hay inputs: se borra de verdad. En manual, según la casilla.
      - run: node backend/src/purge.js ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        if: steps.config.outputs.listo == 'si'
